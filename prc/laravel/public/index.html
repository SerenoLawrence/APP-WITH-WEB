<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CIVILWATCH Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <style>
        body {
            background: linear-gradient(135deg, #1344B5 0%, #1A56DB 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 44px 36px;
            animation: fadeIn 0.4s ease;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: var(--primary-light);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .login-logo .material-symbols-outlined {
            font-size: 34px;
            color: var(--primary);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            text-align: center;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--gray-500);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 0 14px;
            font-size: 14px;
            color: var(--gray-800);
            background: var(--white);
            font-family: var(--font-family);
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--gray-400);
        }

        .login-btn {
            width: 100%;
            height: 46px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 14px rgba(26, 86, 219, 0.35);
        }

        .login-btn .material-symbols-outlined {
            font-size: 20px;
        }

        .login-footer {
            text-align: center;
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
        }

        .login-note {
            background: var(--primary-light);
            border: 1px solid #BFDBFE;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 12px;
            color: var(--gray-600);
            margin-top: 20px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .login-note .material-symbols-outlined {
            font-size: 16px;
            color: var(--primary);
            flex-shrink: 0;
            margin-top: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-logo">
            <span class="material-symbols-outlined">shield</span>
        </div>
        <div class="login-title">CIVILWATCH</div>
        <div class="login-subtitle">System Login — Digos City</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="email" placeholder="Enter your email" autocomplete="email" required />
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Enter your password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="material-symbols-outlined">login</span>
                Sign In
            </button>
        </form>

        <div class="login-note">
            <span class="material-symbols-outlined">info</span>
            <div>
                <strong>Demo credentials:</strong><br>
                Super Admin: <code>admin@civilwatch.gov.ph</code> / <code>admin123</code><br>
                City Engineering: <code>ceo@civilwatch.gov.ph</code> / <code>ceo123</code><br>
                CENRO: <code>cenro@civilwatch.gov.ph</code> / <code>cenro123</code>
            </div>
        </div>

        <div class="login-footer">
            © 2026 CIVILWATCH. All rights reserved.<br>
            Digos City Government
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script>
        // ── Role → redirect map (used after API confirms the role) ───
        const ROLE_REDIRECTS = {
            'super_admin': 'dashboard.html',
            'ceo': 'offices/ceo/dashboard.html',
            'cenro': 'offices/cenro/dashboard.html',
        };

        const ROLE_TITLES = {
            'super_admin': 'Super Admin',
            'ceo': 'City Engineering Officer',
            'cenro': 'CENRO Administrator',
        };

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                Utils.showToast('Please enter both email and password.', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite;">sync</span> Signing in...';

            try {
                // POST to the Laravel Sanctum login endpoint
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password
                    }),
                });

                const json = await response.json();

                if (!response.ok || !json.success) {
                    Utils.showToast(json.message || 'Invalid email or password.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
                    return;
                }

                // ── Store session data in localStorage ───────────────
                const {
                    token,
                    user
                } = json.data;
                localStorage.setItem('cw_token', token);
                localStorage.setItem('cw_role', user.role);
                localStorage.setItem('cw_name', user.name);
                localStorage.setItem('cw_email', user.email);
                localStorage.setItem('cw_title', ROLE_TITLES[user.role] || user.role);

                // ── Redirect based on role ───────────────────────────
                const redirect = ROLE_REDIRECTS[user.role] || 'dashboard.html';

                Utils.showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = redirect;
                }, 800);

            } catch (err) {
                Utils.showToast('Unable to connect to the server. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
            }
        }

        // Auto-fill super admin credentials for demo convenience
        window.addEventListener('load', () => {
            document.getElementById('email').value = 'admin@civilwatch.gov.ph';
            document.getElementById('password').value = 'admin123';
        });
    </script>

    <style>
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>

</body>

</html>
