<!DOCTYPE html>
<html lang="en">
<script>
  (function(){
    var role = localStorage.getItem('cw_role');
    if (!role) { window.location.replace('../../index.html'); }
    else if (role !== 'ceo') {
      window.location.replace(role === 'super_admin' ? '../../dashboard.html' : '../cenro/dashboard.html');
    }
  })();
</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map — City Engineering Office</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/buttons.css" />
  <link rel="stylesheet" href="/css/badges.css" />
  <link rel="stylesheet" href="/css/map.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .map-full-wrap {
      position: relative;
      height: calc(100vh - var(--navbar-height) - 120px);
      min-height: 500px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-sm);
    }
    #ceoMap { width:100%; height:100%; }

    .map-overlay-legend {
      position: absolute;
      bottom: 20px; left: 20px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-md);
      z-index: 500;
      min-width: 160px;
    }
    .map-overlay-legend-title { font-size:12px; font-weight:700; color:var(--gray-700); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .map-legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--gray-600); font-weight:500; margin-bottom:6px; }
    .map-legend-item:last-child { margin-bottom:0; }
    .map-legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

    .map-filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px; font-weight: 600;
      border: 1.5px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      transition: var(--transition);
    }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    .chip .material-symbols-outlined { font-size: 14px; }

    [data-theme="dark"] .map-overlay-legend { background: #1E2330; border-color: var(--gray-200); }
    [data-theme="dark"] .map-overlay-legend-title { color: var(--gray-700); }
  </style>
</head>
<body data-page="map">
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area" id="mainArea">
    <nav class="navbar" id="navbar"></nav>
    <main class="page-content">

      <div class="page-header">
        <div>
          <h1 class="page-title">Infrastructure Reports Map</h1>
          <p class="page-subtitle">Geographic view of all infrastructure reports assigned to City Engineering Office.</p>
        </div>
      </div>

      <!-- Filter chips -->
      <div class="map-filter-chips">
        <span class="chip active" onclick="toggleChip(this,'all')">
          <span class="material-symbols-outlined">layers</span> All Reports
        </span>
        <span class="chip" onclick="toggleChip(this,'In Progress')">
          <span class="material-symbols-outlined">autorenew</span> In Progress
        </span>
        <span class="chip" onclick="toggleChip(this,'For Resolution')">
          <span class="material-symbols-outlined">note_alt</span> For Resolution
        </span>
        <span class="chip" onclick="toggleChip(this,'Resolved')">
          <span class="material-symbols-outlined">task_alt</span> Resolved
        </span>
        <span class="chip" onclick="toggleChip(this,'Assigned')">
          <span class="material-symbols-outlined">assignment_ind</span> Assigned
        </span>
      </div>

      <!-- Map -->
      <div class="map-full-wrap">
        <div id="ceoMap"></div>
        <div class="map-overlay-legend">
          <div class="map-overlay-legend-title">Legend</div>
          <div class="map-legend-item"><div class="map-legend-dot" style="background:#1A56DB"></div> Assigned</div>
          <div class="map-legend-item"><div class="map-legend-dot" style="background:#F97316"></div> In Progress</div>
          <div class="map-legend-item"><div class="map-legend-dot" style="background:#F59E0B"></div> For Resolution</div>
          <div class="map-legend-item"><div class="map-legend-dot" style="background:#10B981"></div> Resolved</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/app.js"></script>
<script>
const ceoMap = L.map('ceoMap', { zoomControl: true, scrollWheelZoom: true }).setView([6.7490, 125.3570], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(ceoMap);

const pinColors = { 'Assigned':'#1A56DB', 'In Progress':'#F97316', 'For Resolution':'#F59E0B', 'Resolved':'#10B981' };

const mapData = [
  { lat:6.7500, lng:125.3540, issue:'Damaged Road',         barangay:'Aplaya',    status:'In Progress',    ref:'CW-2026-00132' },
  { lat:6.7560, lng:125.3600, issue:'Damaged Sidewalk',     barangay:'Zone II',   status:'In Progress',    ref:'CW-2026-00131' },
  { lat:6.7530, lng:125.3570, issue:'Broken Streetlight',   barangay:'Zone III',  status:'For Resolution', ref:'CW-2026-00130' },
  { lat:6.7480, lng:125.3520, issue:'Blocked Drainage',     barangay:'Magsaysay', status:'In Progress',    ref:'CW-2026-00129' },
  { lat:6.7420, lng:125.3480, issue:'Flooding',             barangay:'Buhangin',  status:'Resolved',       ref:'CW-2026-00128' },
  { lat:6.7350, lng:125.3550, issue:'Road Sign Damage',     barangay:'Carmen',    status:'Assigned',       ref:'CW-2026-00127' },
  { lat:6.7610, lng:125.3680, issue:'Bridge Railing',       barangay:'Badiang',   status:'In Progress',    ref:'CW-2026-00126' },
  { lat:6.7320, lng:125.3680, issue:'Broken Streetlight',   barangay:'Dawis',     status:'Resolved',       ref:'CW-2026-00125' },
];

let markers = [];
let activeFilter = 'all';

function createMarker(p) {
  const color = pinColors[p.status] || '#9CA3AF';
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
    iconSize: [28,28], iconAnchor: [14,14]
  });
  return L.marker([p.lat, p.lng], { icon })
    .addTo(ceoMap)
    .bindPopup(`
      <div style="font-size:13px;font-weight:700;color:#111;margin-bottom:4px;">${p.issue}</div>
      <div style="font-size:11px;color:#6B7280;">${p.barangay}</div>
      <div style="font-size:11px;color:#6B7280;margin-top:2px;">${p.ref}</div>
      <div style="margin-top:6px;"><span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:${color}22;color:${color};">${p.status}</span></div>
    `);
}

function renderMarkers() {
  markers.forEach(m => ceoMap.removeLayer(m));
  markers = [];
  const toShow = activeFilter === 'all' ? mapData : mapData.filter(p => p.status === activeFilter);
  toShow.forEach(p => markers.push(createMarker(p)));
}

function toggleChip(el, filter) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFilter = filter;
  renderMarkers();
}

renderMarkers();
</script>
</body>
</html>
